[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "newbie-lab"
version = "0.1.0"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "syxxx00"}]
description = "Standalone local web lab for NewBie image capability testing"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "huggingface-hub[hf_xet]>=1.0,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.package-data]
app = ["grammars/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
